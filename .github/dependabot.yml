version: 2
updates:
  # Actions utilisées dans .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Dépendances npm du backend et du frontend
  - package-ecosystem: npm
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development

  # Images de base des Dockerfile (node:…)
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Image postgres du docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Une version majeure de Postgres change le format des donnees du volume pgdata :
    # elle se fait a la main (pg_dump / restauration), pas via une PR Dependabot.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
