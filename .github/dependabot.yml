version: 2
updates:
  # Actions utilisées dans .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Dépendances npm du backend et du frontend
  - package-ecosystem: npm
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # react et react-dom doivent toujours avoir exactement la meme version :
      # mis a jour separement, chaque PR casse l'app. Declare avant dev-dependencies
      # car un paquet va dans le premier groupe qui le correspond (@types/* sont des devDependencies).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # Les paquets Font Awesome (noyau, icones, composant React) evoluent ensemble :
      # une seule PR evite les conflits en chaine sur package.json / package-lock.json.
      fontawesome:
        patterns:
          - "@fortawesome/*"

      # Seules les versions mineures / correctives sont groupees : chaque version majeure
      # (typescript, eslint, vitest...) arrive dans sa propre PR pour etre traitee une par une.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
        
    # @types/node doit suivre la version de Node.js utilisee (image node:XX-alpine) :
    # ses versions majeures se montent a la main, en meme temps que l'image.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Images de base des Dockerfile (node:…)
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Image postgres du docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Une version majeure de Postgres change le format des donnees du volume pgdata :
    # elle se fait a la main (pg_dump / restauration), pas via une PR Dependabot.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
